<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Local Web Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- Dynamic Greeting & Clock -->
    <div class="greeting-container">
        <h2 id="greeting">Hello!</h2>
        <p id="clock">00:00:00 AM</p>
    </div>
    <h1>Hello World!</h1>
    <p id="text">This HTML page is being served by my local Python web server!</p>

    <!-- Interactive button -->
    <button onclick="changeText()">Click Me</button>

<!-- Terminal / CLI Section -->
    <div class="terminal-container">
        <div class="terminal-header">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="terminal-title">system_cli.exe</span>
        </div>
        <div class="terminal-body" id="terminalOutput">
            <p>Welcome to the System CLI! Type <span class="highlight">'help'</span> for available commands.</p>
        </div>
        <div class="terminal-input-line">
            <span class="prompt">&gt;</span>
            <input type="text" id="terminalInput" placeholder="Type a command..." onkeydown="handleCliCommand(event)" />
        </div>
    </div>
    
    <!-- Feedback Box with Live Character Counter -->
    <div class="feedback-box">
        <h3>Feedback</h3>
        <form action="https://formspree.io/f/mbggyjnd" method="POST" id="feedbackForm">
            <textarea 
                name="message" 
                id="feedbackText" 
                placeholder="Leave your feedback here..." 
                maxlength="200" 
                required
                oninput="updateCharCount()"></textarea>
            
            <div id="charCount" class="char-count">0 / 200 characters</div>
            
            <button type="submit" id="submitBtn">Send Feedback</button>
        </form>
    </div>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
