<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Local Web Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Hello World!</h1>
    <p id="text">This HTML page is being served by my local Python web server!</p>

    <!-- Interactive button -->
    <button onclick="changeText()">Click Me</button>

    <!-- Feedback Box with Formspree -->
    <div class="feedback-box">
        <h3>Feedback</h3>
        <form action="https://formspree.io/f/mbggyjnd" method="POST" id="feedbackForm">
            <textarea name="message" placeholder="Leave your feedback here..." required></textarea>
            <br>
            <button type="submit">Send Feedback</button>
        </form>
    </div>

    <!-- Link to JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
